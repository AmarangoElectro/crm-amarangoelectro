name: Recordatorios de cobranzas

on:
  schedule:
    - cron: "7 9 * * *"
      timezone: "America/Argentina/Buenos_Aires"
  workflow_dispatch:

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar recordatorio a Angie y Maxi
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python scripts/enviar_recordatorios.py
